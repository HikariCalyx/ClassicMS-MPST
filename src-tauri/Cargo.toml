[package]
name = "msclassic"
version = "0.34.4"
edition = "2021"
description = "新楓之谷：經典版 Unity 資料瀏覽、圖片預覽與 JSON/PNG/XML 匯出工具"
default-run = "msclassic"
autoexamples = false

[features]
default = ["desktop"]
# Tauri 桌面殼；wasm 網頁版以 --no-default-features 只編核心。
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-build"]
# 格式逆向研究工具；不納入日常 build、test 或 Clippy。
research-tools = ["dep:hashers", "dep:xxhash-rust"]

[lib]
name = "msclassic"
path = "src/lib.rs"

[[bin]]
name = "msclassic"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "index"
path = "src/bin/index.rs"
# 研究工具，不是 app 的一部分：Tauri 會把每個 bin 都塞進 .app，而 macOS
# 通用版只 lipo 主執行檔，額外的 bin 會讓打包失敗。
required-features = ["research-tools"]

[dependencies]
lz4_flex = "0.11"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
base64 = "0.22"
tauri = { version = "2", features = [], optional = true }
md5 = "0.7"
hashers = { version = "1.0", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
# wasm32 的 Instant/SystemTime 替代（桌面下直接轉發 std）。
web-time = "1"

# wasm 介面層（Step 2）：JS shim import 用；桌面 build 不會帶入。
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
js-sys = "0.3.103"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

